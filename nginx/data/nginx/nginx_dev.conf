proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

upstream identity_upstream {
  server identity:5279;
}

upstream corporate_upstream {
  server corporate:5279;
}

upstream points_upstream {
  server points:5279;
}

server_tokens off;
charset utf-8;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # proxy_set_header X-Forwarded-Proto $scheme;
  proxy_cache_bypass $http_upgrade;

  location /api/identity {
    proxy_pass http://identity_upstream/api;
  }

  location /api/corporate {
    proxy_pass http://corporate_upstream/api;
  }

  location /api/points {
    proxy_pass http://points_upstream/api;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    ssi on;
    root /usr/share/nginx/html/;
    index 50x.html
    internal;
  }
}
