proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

upstream nextjs_upstream {
  server web:3000;
}

upstream identity_upstream {
  server identity:5279;
}

upstream corporate_upstream {
  server corporate:5279;
}

upstream points_upstream {
  server points:5279;
}

server_tokens off;
charset utf-8;

server {
  listen 80;
  listen [::]:80;

  server_name _;

  location /.well-known {
    allow all;
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    ssi on;
    root /usr/share/nginx/html/;
    index 50x.html
    internal;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name anemonlabs.ru www.anemonlabs.ru;

  ssl_certificate /etc/letsencrypt/live/anemonlabs.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/anemonlabs.ru/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  gzip on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_types text/css application/javascript image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # proxy_set_header X-Forwarded-Proto $scheme;
  proxy_cache_bypass $http_upgrade;

  location /.well-known {
    allow all;
    root /var/www/certbot;
  }

  location /update/api {
    proxy_pass http://messaging_upstream/api;
  }

  location /_next/static {
    proxy_cache STATIC;
    proxy_pass http://nextjs_upstream;
  }

  location /static {
    proxy_cache STATIC;
    proxy_ignore_headers Cache-Control;
    proxy_cache_valid 60m;
    proxy_pass http://nextjs_upstream;
  }

  location / {
    proxy_pass http://nextjs_upstream;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    ssi on;
    root /usr/share/nginx/html/;
    index 50x.html
    internal;
  }
}